<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<meta name="theme-color" content="#060a13">

<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

<body>
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">
    <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 20 L12 20 L15 9 L20 27 L23 20 L28 20" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span>前沿观<small>LEADVIEW</small></span>
  </a>
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}#reports">深挖报告</a>
    <a href="{{ '/' | relative_url }}#rules" class="hide-m">标注约定</a>
    <a href="https://github.com/lumisum/leadview" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>
<main>
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">
    <span>前沿观 · 科技动态 —— 只梳理可核实的事实与逻辑链，不构成投资建议。</span>
    <span class="mono">LEADVIEW / FRONTIER SIGNALS</span>
  </div>
</footer>
</body>
</html>
