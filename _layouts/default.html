<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  :root{
    --ink:#1c2430; --muted:#5c6672; --paper:#faf8f4; --card:#ffffff;
    --line:#e5e0d5; --accent:#0f5257; --accent-soft:#e7efee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.85;font-size:16.5px;}
  header.site{border-bottom:1px solid var(--line);background:var(--card)}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}
  header.site .wrap{padding-top:26px;padding-bottom:20px}
  .site-name{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:27px;font-weight:700;letter-spacing:.06em}
  .site-name a{color:var(--ink);text-decoration:none}
  .site-name .dot{color:var(--accent)}
  .site-desc{color:var(--muted);font-size:13.5px;margin-top:2px}
  main .wrap{padding-top:34px;padding-bottom:56px}
  h1,h2,h3{font-family:"Songti SC","STSong","Noto Serif SC",serif;line-height:1.45}
  h1{font-size:29px;margin:0 0 18px}
  h2{font-size:22px;margin:38px 0 12px;padding-top:18px;border-top:1px solid var(--line)}
  h3{font-size:18px;margin:26px 0 8px}
  a{color:var(--accent)}
  table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14.5px;display:block;overflow-x:auto}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  th{background:var(--accent-soft)}
  blockquote{margin:14px 0;padding:10px 16px;background:var(--accent-soft);border-left:3px solid var(--accent);color:var(--ink)}
  code{background:#f0ece2;padding:1px 5px;border-radius:4px;font-size:.92em}
  hr{border:none;border-top:1px solid var(--line);margin:30px 0}
  .report-card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:18px 20px;margin:14px 0;text-decoration:none;color:var(--ink)}
  .report-card:hover{border-color:var(--accent)}
  .report-card .t{font-family:"Songti SC","STSong",serif;font-size:19px;font-weight:700}
  .report-card .m{color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.7}
  footer.site{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  footer.site .wrap{padding-top:18px;padding-bottom:30px}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <div class="site-name"><a href="{{ '/' | relative_url }}">前沿观<span class="dot"> · </span>科技动态</a></div>
    <div class="site-desc">前沿科技动态与深挖报告 —— 只梳理可核实的事实与逻辑链，公司宣称与第三方验证分开标注。</div>
  </div>
</header>
<main>
  <div class="wrap">
    {{ content }}
  </div>
</main>
<footer class="site">
  <div class="wrap">前沿观 · 科技动态 ｜ 报告只梳理事实与逻辑链，不构成投资建议。</div>
</footer>
</body>
</html>
